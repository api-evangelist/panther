openapi: 3.0.3
info:
  title: Panther REST API
  version: '1.0'
servers:
  - url: https://{api_host}
    variables:
      api_host:
        default: your-api-host
paths:
  /alert-comments:
    get:
      tags:
        - comment
      summary: List alert comments
      operationId: comment#list
      parameters:
        - name: alert-id
          in: query
          description: The alert ID the comments are associated with
          allowEmptyValue: true
          required: true
          schema:
            type: string
            description: The alert ID the comments are associated with
        - name: cursor
          in: query
          description: the pagination token
          allowEmptyValue: true
          schema:
            type: string
            description: the pagination token
        - name: limit
          in: query
          description: the maximum results to return
          allowEmptyValue: true
          schema:
            type: integer
            description: the maximum results to return
            default: 25
            format: int64
            maximum: 50
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.ListResp'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.BadRequestError'
    post:
      tags:
        - comment
      summary: Create a comment for an alert
      operationId: comment#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentAPI.ModifyCommentReq'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.Comment'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.NotFoundError'
  /alert-comments/{id}:
    get:
      tags:
        - comment
      summary: Get a comment for an alert
      operationId: comment#get
      parameters:
        - name: id
          in: path
          description: ID of the comment
          required: true
          schema:
            type: string
            description: ID of the comment
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.Comment'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.NotFoundError'
    post:
      tags:
        - comment
      summary: Update a comment for an alert
      operationId: comment#update
      parameters:
        - name: id
          in: path
          description: ID of the comment
          required: true
          schema:
            type: string
            description: ID of the comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentAPI.ModifyCommentReq'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.Comment'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAPI.NotFoundError'
  /alert-context-tags:
    get:
      tags:
        - contexttag
      summary: List all context tags
      description: Returns all context tags, both managed (system-defined) and custom (user-defined)
      operationId: contexttag#list
      parameters:
        - name: cursor
          in: query
          description: Pagination token from a previous request
          allowEmptyValue: true
          schema:
            type: string
            description: Pagination token from a previous request
        - name: limit
          in: query
          description: Maximum number of results to return
          allowEmptyValue: true
          schema:
            type: integer
            description: Maximum number of results to return
            default: 2000
            format: int64
            minimum: 1
            maximum: 2000
        - name: managed
          in: query
          description: 'Filter by tag type: true for managed tags only, false for custom tags only, omit for all tags'
          allowEmptyValue: true
          schema:
            type: boolean
            description: 'Filter by tag type: true for managed tags only, false for custom tags only, omit for all tags'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.ListContextTagsResp'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.BadRequestError'
    post:
      tags:
        - contexttag
      summary: Create a custom context tag
      description: Creates a new custom context tag. Returns 409 Conflict if the tag already exists.
      operationId: contexttag#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/contexttagAPI.CreateContextTagReq'
      responses:
        '201':
          description: Created response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.BadRequestError'
        '409':
          description: 'exists: Conflict response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.ExistsError'
  /alert-context-tags/{tag}:
    delete:
      tags:
        - contexttag
      summary: Delete a custom context tag
      description: Deletes a custom context tag. Managed tags cannot be deleted.
      operationId: contexttag#delete
      parameters:
        - name: tag
          in: path
          description: The tag value to delete
          required: true
          schema:
            type: string
            description: The tag value to delete
            pattern: ^[a-z0-9_-]+$
            minLength: 1
            maxLength: 30
      responses:
        '204':
          description: No Content response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.BadRequestError'
    patch:
      tags:
        - contexttag
      summary: Rename a custom context tag
      description: Atomically renames a custom context tag. Returns 404 if the tag doesn't exist, 409 if the target tag already exists.
      operationId: contexttag#update
      parameters:
        - name: tag
          in: path
          description: The current tag value to rename
          required: true
          schema:
            type: string
            description: The current tag value to rename
            pattern: ^[a-z0-9_-]+$
            minLength: 1
            maxLength: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/contexttagAPI.UpdateContextTagReq'
      responses:
        '204':
          description: No Content response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.NotFoundError'
        '409':
          description: 'exists: Conflict response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contexttagAPI.ExistsError'
  /alerts:
    get:
      tags:
        - alert
      summary: List alerts
      operationId: alert#list
      parameters:
        - name: type
          in: query
          allowEmptyValue: true
          schema:
            type: string
            default: ALERT
            enum:
              - ALERT
              - DETECTION_ERROR
              - SYSTEM_ERROR
        - name: sub-type
          in: query
          description: The sub-type of the alert
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
              enum:
                - RULE
                - RULE_ERROR
                - SCHEDULED_RULE
                - SCHEDULED_RULE_ERROR
                - POLICY
                - SYSTEM_ERROR
                - CORRELATION_RULE
                - CORRELATION_RULE_ERROR
            description: The sub-type of the alert
        - name: cursor
          in: query
          description: the pagination token
          allowEmptyValue: true
          schema:
            type: string
            description: the pagination token
        - name: limit
          in: query
          description: the maximum results to return
          allowEmptyValue: true
          schema:
            type: integer
            description: the maximum results to return
            default: 25
            format: int64
            maximum: 50
        - name: created-after
          in: query
          description: The date and time after which the alerts were created. If empty we default to 30 days ago
          allowEmptyValue: true
          schema:
            type: string
            description: The date and time after which the alerts were created. If empty we default to 30 days ago
            example: '1672531200'
          examples:
            Date only:
              summary: Date only
              value: '2025-01-01'
            Month only:
              summary: Month only
              value: 2025-01
            RFC3339:
              summary: RFC3339
              value: '2025-01-01T15:04:05Z'
            Unix timestamp:
              summary: Unix timestamp
              value: '1672531200'
        - name: created-before
          in: query
          description: The date and time before which the alerts were created. If empty we default to the current time
          allowEmptyValue: true
          schema:
            type: string
            description: The date and time before which the alerts were created. If empty we default to the current time
            example: '1672531200'
          examples:
            Date only:
              summary: Date only
              value: '2025-01-01'
            Month only:
              summary: Month only
              value: 2025-01
            RFC3339:
              summary: RFC3339
              value: '2025-01-01T15:04:05Z'
            Unix timestamp:
              summary: Unix timestamp
              value: '1672531200'
        - name: detection-id
          in: query
          description: The detection ID to filter alerts by
          allowEmptyValue: true
          schema:
            type: string
            description: The detection ID to filter alerts by
        - name: sort-dir
          in: query
          description: The sort direction of the results
          allowEmptyValue: true
          schema:
            type: string
            description: The sort direction of the results
            default: desc
            enum:
              - asc
              - desc
        - name: name-contains
          in: query
          description: A string to search for in the alert name
          allowEmptyValue: true
          schema:
            type: string
            description: A string to search for in the alert name
        - name: log-source
          in: query
          description: The log source of the alert
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
            description: The log source of the alert
        - name: log-type
          in: query
          description: The log type of the alert
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
            description: The log type of the alert
        - name: resource-type
          in: query
          description: The resource type of the alert
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
            description: The resource type of the alert
        - name: status
          in: query
          description: The status of the alert
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
              enum:
                - OPEN
                - CLOSED
                - TRIAGED
                - RESOLVED
            description: The status of the alert
        - name: severity
          in: query
          description: The severity of the alert
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
              enum:
                - CRITICAL
                - HIGH
                - MEDIUM
                - LOW
                - INFO
            description: The severity of the alert
        - name: assignee
          in: query
          description: The assignee of the alert. This should be a user id
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
            description: The assignee of the alert. This should be a user id
        - name: event-count-min
          in: query
          description: The minimum number of events in the alert
          allowEmptyValue: true
          schema:
            type: integer
            description: The minimum number of events in the alert
            format: int64
        - name: event-count-max
          in: query
          description: The maximum number of events in the alert
          allowEmptyValue: true
          schema:
            type: integer
            description: The maximum number of events in the alert
            format: int64
        - name: quality
          in: query
          description: Filter by alert quality
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
              enum:
                - NOISE
                - USEFUL
            description: Filter by alert quality
        - name: context-tag
          in: query
          description: Filter by context tags applied to alerts
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
              description: Tag to provide context for this alert
              pattern: ^[a-z0-9_-]+$
              minLength: 1
              maxLength: 30
            description: Filter by context tags applied to alerts
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.ListResp'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.BadRequestError'
    patch:
      tags:
        - alert
      summary: Update the status, assignee, quality or contextTags of multiple alerts
      operationId: alert#bulkPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAPI.BulkPatchAlertReq2'
      responses:
        '204':
          description: No Content response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.NotFoundError'
  /alerts/{id}:
    get:
      tags:
        - alert
      summary: Get an alert
      operationId: alert#get
      parameters:
        - name: id
          in: path
          description: ID of the alert
          required: true
          schema:
            type: string
            description: ID of the alert
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.Alert'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.NotFoundError'
    patch:
      tags:
        - alert
      summary: Update the status, assignee, quality or contextTags of an alert
      operationId: alert#patch
      parameters:
        - name: id
          in: path
          description: ID of the alert
          required: true
          schema:
            type: string
            description: ID of the alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAPI.PatchAlertReq'
      responses:
        '200':
          description: OK response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.NotFoundError'
  /alerts/{id}/events:
    get:
      tags:
        - alert
      summary: List alert events
      operationId: alert#events
      parameters:
        - name: cursor
          in: query
          description: the pagination token
          allowEmptyValue: true
          schema:
            type: string
            description: the pagination token
        - name: limit
          in: query
          description: the maximum results to return
          allowEmptyValue: true
          schema:
            type: integer
            description: the maximum results to return
            default: 25
            format: int64
            maximum: 50
        - name: id
          in: path
          description: The alert id
          required: true
          schema:
            type: string
            description: The alert id
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.ListEventsResp'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAPI.NotFoundError'
  /api-tokens:
    get:
      tags:
        - api token
      summary: List api tokens
      operationId: api token#list
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.ListResp'
    post:
      tags:
        - api token
      summary: Create an api token
      operationId: api token#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenAPI.ModifyAPIToken'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.APIToken'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.BadRequestError'
  /api-tokens/{id}:
    delete:
      tags:
        - api token
      summary: delete api token
      operationId: api token#delete
      parameters:
        - name: id
          in: path
          description: 'ID of the api token to delete. Note: if self is provided, the current api token will be deleted'
          required: true
          schema:
            type: string
            description: 'ID of the api token to delete. Note: if self is provided, the current api token will be deleted'
      responses:
        '204':
          description: No Content response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.NotFoundError'
    get:
      tags:
        - api token
      summary: Get an api token
      operationId: api token#get
      parameters:
        - name: id
          in: path
          description: 'ID of the api token. Note: if self is provided, the current api token will be returned'
          required: true
          schema:
            type: string
            description: 'ID of the api token. Note: if self is provided, the current api token will be returned'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.APIToken'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.NotFoundError'
    post:
      tags:
        - api token
      summary: Update an api token
      operationId: api token#update
      parameters:
        - name: id
          in: path
          description: 'ID of the api token. Note: if self is provided, the current api token will be updated'
          required: true
          schema:
            type: string
            description: 'ID of the api token. Note: if self is provided, the current api token will be updated'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenAPI.ModifyAPIToken'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.APIToken'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.NotFoundError'
  /api-tokens/{id}/rotate:
    post:
      tags:
        - api token
      summary: Rotate an api token. If self is provided the current token will be rotated
      operationId: api token#rotate
      parameters:
        - name: id
          in: path
          description: 'ID of the api token to rotate. Note: if self is provided, the current api token will be rotated'
          required: true
          schema:
            type: string
            description: 'ID of the api token to rotate. Note: if self is provided, the current api token will be rotated'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.APIToken'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.BadRequestError'
        '403':
          description: 'forbidden: Forbidden response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.ForbiddenErr'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenAPI.NotFoundError'
  /cloud-accounts/aws:
    post:
      tags:
        - aws cloud account
      summary: create aws cloud account
      operationId: aws cloud account#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AWSCloudAccountAPI.CreateAWSCloudAccount'
      responses:
        '201':
          description: Created response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.AWSCloudAccount'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.BadRequestError'
        '409':
          description: 'exists: Conflict response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.ExistsError'
        '500':
          description: 'service: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.ServiceError'
  /cloud-accounts/aws/{id}:
    delete:
      tags:
        - aws cloud account
      summary: delete aws cloud account
      operationId: aws cloud account#delete
      parameters:
        - name: id
          in: path
          description: ID of the AWS Cloud Account to delete
          required: true
          schema:
            type: string
            description: ID of the AWS Cloud Account to delete
      responses:
        '204':
          description: No Content response.
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.BadRequestError'
        '500':
          description: 'service: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.ServiceError'
    get:
      tags:
        - aws cloud account
      summary: get aws cloud account
      operationId: aws cloud account#get
      parameters:
        - name: id
          in: path
          description: ID of the AWS Cloud Account to fetch
          required: true
          schema:
            type: string
            description: ID of the AWS Cloud Account to fetch
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.AWSCloudAccount'
        '400':
          description: 'bad_request: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.BadRequestError'
        '404':
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.NotFoundError'
        '500':
          description: 'service: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSCloudAccountAPI.ServiceError'
    put:
      tags:
        - aws cloud account
      summary: put aws cloud account
      operationId: aws cloud account#put
      parameters:
        - name: id
          in: path
          description: ID of the AWS Cloud Account to update
          required: true
          schema:
            type: string
