aid: panther
name: Panther
description: >-
  Panther is a cloud-native, code-driven detection and response platform and
  AI-powered SOC that ingests and normalizes security logs at petabyte scale
  into a security data lake (customer-connected AWS/Snowflake/Databricks or
  Panther-hosted). It offers Python detection-as-code, AI-generated detections,
  correlation and scheduled rules, cloud-security policies, and an AI SOC agent
  that auto-triages and investigates alerts. Developers automate it through a
  REST API (X-API-Key), a GraphQL API, Terraform, the panther_analysis_tool
  CLI, and official local and remote MCP servers. Backed by ICONIQ Capital and
  Lightspeed Venture Partners.
url: https://raw.githubusercontent.com/api-evangelist/panther/refs/heads/main/apis.yml
